backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "news"
    label: "News & Events"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Title (ခေါင်းစဉ်)", name: "title", widget: "string" }
      - { label: "Publish Date (ရက်စွဲ)", name: "date", widget: "datetime" }
      - { label: "Cover Photo (ပင်တိုင်မျက်နှာဖုံးပုံ)", name: "thumbnail", widget: "image", required: false }
      - { label: "Video URL (YouTube ဗီဒီယိုလင့်ခ် - ထည့်လိုပါက)", name: "video_url", widget: "string", required: false, hint: "Paste YouTube link or embed URL here" }
      - { label: "Author (ရေးသူ/ထုတ်ပြန်သူ)", name: "author", widget: "string", default: "Htwe Oo Myanmar" }
      - label: "Category (မျိုးအစား)"
        name: "category"
        widget: "select"
        options: ["သတင်းနှင့်ထုတ်ပြန်ချက်", "ရုပ်သေးပွဲစဉ်များ", "နိုင်ငံတကာခရီးစဉ်", "အထွေထွေ"]
        default: "သတင်းနှင့်ထုတ်ပြန်ချက်"
      - { label: "Summary / Caption (အကျဉ်းချုပ်/Facebook Caption)", name: "summary", widget: "text", required: false }
      - { label: "Body Content (စာမူအပြည့်အစုံ ရေးရန်)", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Performance Moments (Gallery)"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title / Caption (ပုံခေါင်းစဉ်)", name: "title", widget: "string", required: false }
      - { label: "Photo (ဓာတ်ပုံ)", name: "image", widget: "image" }

  - name: "videos"
    label: "Featured Performances (Videos)"
    folder: "content/videos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Video Title (ဗီဒီယို ခေါင်းစဉ်)", name: "title", widget: "string" }
      - { label: "YouTube Video URL or Embed Link", name: "video_url", widget: "string" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About Us Page"
        file: "content/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "YouTube Video URL", name: "video_url", widget: "string", required: false, hint: "Paste YouTube link or embed URL here" }
          - { label: "Body", name: "body", widget: "markdown" }

      - name: "schedule"
        label: "Live Performance Schedule"
        file: "content/pages/schedule.md"
        fields:
          - { label: "Badge Title (အပေါ်ဘက်တံဆိပ်)", name: "badge", widget: "string", default: "LIVE PERFORMANCE STAGE" }
          - { label: "Section Title (ခေါင်းစဉ်ကြီး)", name: "title", widget: "string", default: "Live Performance Schedule" }
          - { label: "Subtitle (ခေါင်းစဉ်ငယ်)", name: "subtitle", widget: "string", default: "Join Our Daily Traditional Marionette Show in Phnom Penh" }
          - { label: "Showtime Label (အချိန်ခေါင်းစဉ်)", name: "showtime_label", widget: "string", default: "DAILY SHOWTIME" }
          - { label: "Showtime Value (ပြသမည့်အချိန်)", name: "showtime_val", widget: "string", default: "3:00 PM (Local Time)" }
          - { label: "Venue Label (နေရာခေါင်းစဉ်)", name: "venue_label", widget: "string", default: "VENUE LOCATION" }
          - { label: "Venue Address (လိပ်စာအပြည့်အစုံ)", name: "venue_val", widget: "text", default: "#8, Long Nget St. (258), Phnom Penh, Cambodia" }
          - { label: "Ticket Button Text (လက်မှတ်ခလုတ်စာသား)", name: "ticket_text", widget: "string", default: "Reserve Tickets Online" }
          - { label: "Ticket Button Link (လက်မှတ်ဝယ်ယူရန်လင့်ခ်)", name: "ticket_url", widget: "string", default: "https://www.theboxofficephnompenh.com/events" }
