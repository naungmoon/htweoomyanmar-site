backend:
  name: github
  repo: naungmoon/htweoomyanmar-site
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "news"
    label: "News & Events"
    folder: "content/news"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Cover Photo", name: "thumbnail", widget: "image", required: false}
      - {label: "Video URL (Optional)", name: "video_url", widget: "string", required: false}
      - {label: "Author", name: "author", widget: "string", default: "Htwe Oo Myanmar"}
      - {label: "Category", name: "category", widget: "select", options: ["သတင်းနှင့်ထုတ်ပြန်ချက်", "ရုပ်သေးပွဲစဉ်များ", "ခရီးစဉ်များ", "အထွေထွေ"]}
      - {label: "Summary / Caption", name: "summary", widget: "text", required: false}
      - {label: "Body Content", name: "body", widget: "markdown", required: false}
