backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "news"
    label: "News & Events"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Title (ခေါင်းစဉ်)", name: "title", widget: "string" }
      - { label: "Publish Date (ရက်စွဲ)", name: "date", widget: "datetime" }
      - { label: "Cover Photo (ပင်တိုင်မျက်နှာဖုံးပုံ)", name: "thumbnail", widget: "image", required: false }
      - { label: "Author (စာရေးသူ/ထုတ်ပြန်သူ)", name: "author", widget: "string", default: "Htwe Oo Myanmar" }
      - { 
          label: "Category (အမျိုးအစား)", 
          name: "category", 
          widget: "select", 
          options: ["သတင်းနှင့်ထုတ်ပြန်ချက်", "ရိုးရာရုပ်သေးပွဲစဉ်များ", "ပြည်ပခရီးစဉ်များ", "အထွေထွေ"],
          default: "သတင်းနှင့်ထုတ်ပြန်ချက်"
        }
      - { label: "Summary / Caption (အကျဉ်းချုပ်/Facebook Caption)", name: "summary", widget: "text", required: false }
      - { label: "Body Content (စာမူအပြည့်အစုံ ရေးရန်)", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Performance Moments (Gallery)"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title / Caption (ပုံခေါင်းစဉ်/ဖော်ပြချက်)", name: "title", widget: "string" }
      - { label: "Photo (ဓာတ်ပုံ)", name: "image", widget: "image" }

  - name: "videos"
    label: "Featured Performances (Videos)"
    folder: "content/videos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Video Title (ဗီဒီယို ခေါင်းစဉ်)", name: "title", widget: "string" }
      - { label: "YouTube Video URL or Embed ID (ဥပမာ- https://www.youtube.com/watch?v=c-PD2fwMVuU သို့မဟုတ် c-PD2fwMVuU)", name: "video_url", widget: "string" }

  - name: "pages"
    label: "Pages"
    files:
      - file: "content/pages/about.md"
        label: "About Us Page"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
