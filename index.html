<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="author" content="Htwe Oo Myanmar" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <title>Htwe Oo Myanmar | Traditional Puppetry Art</title>

    <style>
        :root {
            --primary-gold: #FFD700;
            --crimson-red: #D2143A;
            --royal-purple: #4A0E4E;
            --deep-bg: #0d0f12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-light: #f8f9fa;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--deep-bg);
            color: var(--text-light);
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .brand-title {
            font-family: 'Cinzel', serif;
        }

        .hero-section {
            padding: 80px 0 40px;
            background: linear-gradient(180deg, rgba(74,14,78,0.4) 0%, rgba(13,15,18,1) 100%);
        }

        .card-custom {
            background: var(--card-bg);
            border: 1px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card-custom:hover {
            transform: translateY(-5px);
            border-color: var(--primary-gold);
        }

        .text-gold {
            color: var(--primary-gold) !important;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning sticky-top">
        <div class="container">
            <a class="navbar-brand brand-title text-gold fs-3 fw-bold" href="#">HTWE OO MYANMAR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#news-section">News & Events</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content / Hero -->
    <section class="hero-section text-center container">
        <h1 class="display-4 text-gold fw-bold mb-3">Traditional Puppetry Art</h1>
        <p class="lead text-light opacity-75 max-width-700 mx-auto">
            Preserving and promoting traditional Myanmar marionette puppetry for future generations.
        </p>
    </section>

    <!-- Dynamic News & Events Section -->
    <section id="news-section" class="py-5 container">
        <div class="d-flex align-items-center mb-4">
            <h2 class="text-gold m-0 me-3"><i class="fa-solid fa-newspaper me-2"></i>News & Events</h2>
            <div class="flex-grow-1 border-bottom border-secondary opacity-50"></div>
        </div>

        <!-- Decap CMS မှ တင်ထားသော Posts များ အလိုအလျောက် ပေါ်လာမည့် Container -->
        <div class="row" id="news-container">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted">Loading news and events...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="text-center py-4 border-top border-secondary mt-5">
        <p class="small text-muted mb-0">&copy; Htwe Oo Myanmar. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Auto Fetch News Script for Decap CMS -->
    <script>
        async function loadNewsEvents() {
            const newsContainer = document.getElementById('news-container');
            if (!newsContainer) return;

            try {
                // Fetch list of files in content/news directory via GitHub API
                const response = await fetch('https://api.github.com/repos/naungmoon/htweoomyanmar-site/contents/content/news');
                
                if (!response.ok) {
                    newsContainer.innerHTML = '<div class="col-12 text-center text-muted"><p>No news or events available yet.</p></div>';
                    return;
                }
                
                const files = await response.json();
                const markdownFiles = files.filter(file => file.name.endsWith('.md'));

                if (markdownFiles.length === 0) {
                    newsContainer.innerHTML = '<div class="col-12 text-center text-muted"><p>No news or events available yet.</p></div>';
                    return;
                }

                newsContainer.innerHTML = ''; // Loading spinner ရှင်းထုတ်ခြင်း

                // ဖိုင်တစ်ခုချင်းစီ၏ စာသားများကို ဖတ်ယူ၍ Card UI ပြုလုပ်ခြင်း
                for (const file of markdownFiles) {
                    const res = await fetch(file.download_url);
                    const text = await res.text();

                    // Frontmatter (---) နှင့် Body ကို ခွဲထုတ်ခြင်း
                    const frontmatterMatch = text.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);
                    let title = file.name.replace('.md', '');
                    let date = '';
                    let body = text;

                    if (frontmatterMatch) {
                        const yaml = frontmatterMatch[1];
                        body = frontmatterMatch[2];

                        const titleMatch = yaml.match(/title:\s*["']?(.*?)["']?$/m);
                        const dateMatch = yaml.match(/date:\s*["']?(.*?)["']?$/m);

                        if (titleMatch) title = titleMatch[1];
                        if (dateMatch) date = dateMatch[1];
                    }

                    // Dynamic Card HTML Element
                    const cardHtml = `
                        <div class="col-md-6 col-lg-4 mb-4">
                            <div class="card h-100 card-custom text-light">
                                <div class="card-body">
                                    <h5 class="card-title text-gold fw-bold mb-2">${title}</h5>
                                    ${date ? `<h6 class="card-subtitle mb-3 text-muted small"><i class="fa-regular fa-calendar me-1"></i>${new Date(date).toLocaleDateString()}</h6>` : ''}
                                    <div class="card-text small text-light opacity-90">${marked.parse(body)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    newsContainer.innerHTML += cardHtml;
                }
            } catch (err) {
                console.error('Error fetching news:', err);
                newsContainer.innerHTML = '<div class="col-12 text-center text-muted"><p>Unable to load news at this time.</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadNewsEvents);
    </script>
</body>
</html>
